general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/mateo/dotfiles/wallpapers/wall.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    color = rgb(cdd6f4)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgb(f5c2e7)
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    outer_color = rgba(89b4faee) rgba(cba6f7ee) 45deg
    inner_color = rgba(1e1e2ecc)
    font_color = rgb(cdd6f4)
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    placeholder_text = <i>Contraseña...</i>
    fail_text = <i>Incorrecta</i>
    fade_on_empty = false
    rounding = 12
    position = 0, -60
    halign = center
    valign = center
}
